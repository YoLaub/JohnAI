version: '3.8'

services:
  johnai-server:
    build:
      # Repo root, not server/ — the Dockerfile needs client/ too, to build
      # the PWA static assets it serves at "/".
      context: ..
      dockerfile: server/Dockerfile
    container_name: johnai-vps-server
    restart: always
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/johnai_memory.db
      - UPLOAD_DIR=/app/data/uploads
      - OLLAMA_URL=http://host.docker.internal:11434
      - GENERAL_MODEL=gemma3:12b
      - CODER_MODEL=qwen2.5-coder:14b
      - WHISPER_MODEL=small
      # Required: shared secret every device must send (X-API-Key header, or
      # ?api_key= for the websocket). Server refuses every non-public route
      # without it. Set a real value in Coolify's env vars, never commit one.
      - API_KEY=${API_KEY}
      # Required to use the MCP server (/mcp): bearer token, distinct from
      # API_KEY (different exposure surface). Set a real value in Coolify's
      # env vars, never commit one.
      - MCP_API_KEY=${MCP_API_KEY}
    volumes:
      - johnai_data:/app/data

volumes:
  johnai_data:
    driver: local
