[package]
name = "johnai-desktop"
version = "0.1.0"
description = "JohnAi Floating Desktop Widget"
authors = ["Yoann"]
edition = "2021"

[lib]
name = "johnai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Local Whisper STT (whisper-rs/whisper.cpp) is desktop-only: whisper-rs-sys 0.15's
# build.rs uses `cfg!(target_os = "macos")` to decide link flags, which reflects the
# *host* OS in a build script, not the cross-compile target — so it wrongly demands
# a macOS-only static lib (ggml-blas) when cross-compiling to Android from macOS.
# Android uses the phone's own speech recognizer instead (see below).
[target.'cfg(not(target_os = "android"))'.dependencies]
whisper-rs = "0.16.0"
reqwest = { version = "0.13.4", features = ["stream", "json"] }
futures-util = "0.3.33"

# Android dictation: Android's built-in SpeechRecognizer, on-device, no server
# round-trip. The plugin's own whisper-rs dependency is desktop-only, so the
# cross-compile issue above doesn't apply. Pinned: third-party code with mic access.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-stt = "=0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal", "coreml"] }
