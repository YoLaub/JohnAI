[package]
name = "johnai-desktop"
version = "0.1.0"
description = "JohnAi Floating Desktop Widget"
authors = ["Yoann"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
whisper-rs = "0.16.0"
reqwest = { version = "0.13.4", features = ["stream"] }
futures-util = "0.3.33"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal", "coreml"] }
